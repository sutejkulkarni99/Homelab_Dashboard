<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Atheris Hub - Login</title><style>
:root{--bg:#090A0E;--card:#12151E;--bd:#232838;--fg:#F3F4F6;--mt:#9CA3AF;--ac:#A855F7;--gl:rgba(168,85,247,.25);--rd:#EF4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hdr{text-align:center;margin-bottom:2rem}
.logo{width:48px;height:48px;background:linear-gradient(135deg,#A855F7,#6366F1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;color:#fff;margin:0 auto 1rem;box-shadow:0 0 20px var(--gl)}
.ttl{font-size:1.4rem;font-weight:700;margin-bottom:.3rem}
.tag{font-size:.82rem;color:var(--ac);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.g{margin-bottom:1.25rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mt);margin-bottom:.4rem}
input{width:100%;background:#0b0d13;border:1px solid var(--bd);border-radius:8px;padding:.75rem 1rem;color:var(--fg);font-size:.95rem;outline:none}
input:focus{border-color:var(--ac);box-shadow:0 0 8px var(--gl)}
button{width:100%;background:var(--ac);border:none;border-radius:8px;color:#fff;padding:.85rem;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:.5rem}
button:hover{opacity:.9}button:disabled{opacity:.5;cursor:wait}
.err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--rd);padding:.65rem;border-radius:8px;font-size:.82rem;text-align:center;margin-top:1rem}
.ft{text-align:center;font-size:.75rem;color:var(--mt);margin-top:2rem}
</style></head><body>
<div class="card"><div class="hdr"><div class="logo">A</div><div class="ttl">AtherisHub</div><div class="tag">Dual-Node V2.0</div></div>
<form id="f"><div class="g"><label for="u">USERNAME</label><input id="u" required autocomplete="username" placeholder="sutej"></div>
<div class="g"><label for="p">PASSWORD</label><input id="p" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
<button id="b" type="submit">Sign In</button><div class="err" id="e">Invalid username or password.</div></form></div>
<div class="ft">🔒 Tailscale Mesh Access Required</div>
<script>
document.getElementById('f').addEventListener('submit',async ev=>{
ev.preventDefault();
const u=document.getElementById('u').value,p=document.getElementById('p').value,
e=document.getElementById('e'),b=document.getElementById('b');
e.style.display='none';b.innerText='Verifying...';b.disabled=true;
try{
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
if(r.ok){window.location.href='/';return;}
e.innerText='Invalid username or password.';e.style.display='block';document.getElementById('p').value='';
}catch(x){e.innerText='Connection error. Verify Tailscale.';e.style.display='block';}
finally{b.innerText='Sign In';b.disabled=false;}
});
</script></body></html>
