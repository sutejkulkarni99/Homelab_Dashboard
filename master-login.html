<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#05070E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PolarisHub">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<title>Polaris Hub - Login</title>
<style>
:root {
  --bg: #05070E;
  --bg-deep: #0A0D1A;
  --card: rgba(14, 18, 32, 0.85);
  --bd: #1B2238;
  --bd-hover: #2A3455;
  --fg: #E8ECF5;
  --mt: #8B94AD;
  --star: #F5E6C8;
  --aurora: #7DD3FC;
  --nebula: #A78BFA;
  --rd: #F87171;
  --gn: #4ADE80;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

body {
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 50% 15%, #0E162B 0%, var(--bg) 75%),
    radial-gradient(circle at 80% 80%, rgba(167, 139, 250, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 20% 70%, rgba(125, 211, 252, 0.05) 0%, transparent 50%);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  position: relative;
  overflow: hidden;
}

/* Background Star Field */
body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    radial-gradient(1px 1px at 20px 30px, #E8ECF5, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 150px 80px, #F5E6C8, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 280px 120px, #7DD3FC, rgba(0,0,0,0)),
    radial-gradient(1.2px 1.2px at 400px 200px, #E8ECF5, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 550px 60px, #F5E6C8, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 700px 180px, #A78BFA, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 850px 300px, #E8ECF5, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 90px 450px, #7DD3FC, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 320px 520px, #F5E6C8, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 620px 480px, #E8ECF5, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 800px 600px, #A78BFA, rgba(0,0,0,0));
  background-size: 900px 700px;
  opacity: 0.6;
  animation: starDrift 60s linear infinite;
  pointer-events: none;
}

@keyframes starDrift {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(0.5deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}

/* Shooting Star */
.shooting-star {
  position: fixed;
  top: 15%;
  left: -120px;
  width: 140px;
  height: 1.5px;
  background: linear-gradient(90deg, rgba(245, 230, 200, 0.9), transparent);
  transform: rotate(-30deg);
  opacity: 0;
  animation: shoot 30s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

@keyframes shoot {
  0%, 93% { left: -140px; top: 15%; opacity: 0; }
  94% { opacity: 1; }
  96% { left: 110vw; top: 75%; opacity: 0; }
  100% { opacity: 0; }
}

.card {
  position: relative;
  z-index: 10;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 2.5rem;
  width: 100%;
  max-width: 420px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(125, 211, 252, 0.05);
  transition: border-color 0.3s;
}

.card:hover {
  border-color: var(--bd-hover);
}

.hdr { text-align: center; margin-bottom: 2rem; }

.logo {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, rgba(245, 230, 200, 0.15), rgba(125, 211, 252, 0.1));
  border: 1px solid rgba(245, 230, 200, 0.3);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
  box-shadow: 0 0 20px rgba(245, 230, 200, 0.2);
}

.logo svg {
  width: 28px;
  height: 28px;
  filter: drop-shadow(0 0 6px rgba(245, 230, 200, 0.8));
}

.ttl {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.02em;
  margin-bottom: 0.3rem;
}

.tag {
  font-size: 0.78rem;
  color: var(--star);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
  opacity: 0.9;
}

.g { margin-bottom: 1.25rem; }

label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--mt);
  margin-bottom: 0.4rem;
  letter-spacing: 0.5px;
}

input {
  width: 100%;
  background: rgba(5, 7, 14, 0.7);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 0.8rem 1rem;
  color: var(--fg);
  font-size: 0.95rem;
  outline: none;
  transition: all 0.2s;
}

input:focus {
  border-color: var(--aurora);
  box-shadow: 0 0 12px rgba(125, 211, 252, 0.2);
  background: rgba(5, 7, 14, 0.9);
}

button {
  width: 100%;
  background: linear-gradient(135deg, var(--star), #E2C392);
  border: none;
  border-radius: 8px;
  color: #05070E;
  padding: 0.85rem;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: all 0.2s;
  box-shadow: 0 0 15px rgba(245, 230, 200, 0.2);
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 20px rgba(245, 230, 200, 0.35);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
  transform: none;
}

.err {
  display: none;
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.3);
  color: var(--rd);
  padding: 0.65rem;
  border-radius: 8px;
  font-size: 0.82rem;
  text-align: center;
  margin-top: 1rem;
}

.ft {
  position: relative;
  z-index: 10;
  text-align: center;
  font-size: 0.78rem;
  color: var(--mt);
  margin-top: 2rem;
  letter-spacing: 0.5px;
}

@media (prefers-reduced-motion: reduce) {
  body::before, .shooting-star, button, .card {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<div class="shooting-star"></div>

<div class="card">
  <div class="hdr">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L13.8 9.2L21 11L13.8 12.8L12 20L10.2 12.8L3 11L10.2 9.2L12 2Z" fill="#F5E6C8"/>
      </svg>
    </div>
    <div class="ttl">PolarisHub</div>
    <div class="tag">Dual-Node V2.0</div>
  </div>

  <form id="f">
    <div class="g">
      <label for="u">USERNAME</label>
      <input id="u" required autocomplete="username" placeholder="sutej">
    </div>
    <div class="g">
      <label for="p">PASSWORD</label>
      <input id="p" type="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button id="b" type="submit">Sign In</button>
    <div class="err" id="e">Invalid username or password.</div>
  </form>
</div>

<div class="ft">🔒 Tailscale Mesh Access Required</div>

<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const u = document.getElementById('u').value, p = document.getElementById('p').value,
        e = document.getElementById('e'), b = document.getElementById('b');
  e.style.display = 'none'; b.innerText = 'Verifying...'; b.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (r.ok) { window.location.href = '/'; return; }
    e.innerText = 'Invalid username or password.'; e.style.display = 'block'; document.getElementById('p').value = '';
  } catch(x) {
    e.innerText = 'Connection error. Verify Tailscale.'; e.style.display = 'block';
  } finally {
    b.innerText = 'Sign In'; b.disabled = false;
  }
});
</script>
</body>
</html>
