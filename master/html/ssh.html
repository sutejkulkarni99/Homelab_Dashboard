<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polaris Hub - SSH</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#1a1f3a 0%,#0a0f1e 50%,#050810 100%);color:#e4e9f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(14,18,32,.85);border-bottom:1px solid rgba(120,140,200,.15);backdrop-filter:blur(12px)}
  .header h1{font-size:16px;font-weight:600;margin:0}
  .header h1 span{color:#f0c987}
  .nav a{color:#8b96b0;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px;margin-left:8px;transition:all .15s}
  .nav a:hover{color:#f0c987;background:rgba(240,201,135,.08)}
  .notice{padding:10px 20px;background:rgba(240,201,135,.06);border-bottom:1px solid rgba(240,201,135,.15);font-size:12px;color:#f0c987}
  iframe{width:100%;height:calc(100vh - 85px);border:none;display:block}
</style>
</head>
<body>
<div class="header">
  <h1>Polaris <span>SSH</span></h1>
  <div class="nav">
    <a href="/">Dashboard</a>
    <a href="/projects">Projects</a>
    <a href="/logout" onclick="event.preventDefault();fetch('/api/logout').then(()=>location.href='/login')">Logout</a>
  </div>
</div>
<div class="notice">If prompted for credentials, use the same username and password as Polaris.</div>
<iframe src="http://100.116.47.43:7681/" allow="clipboard-read; clipboard-write" style="width:100%;height:calc(100vh - 85px);border:none;display:block"></iframe>
</body>
</html>
