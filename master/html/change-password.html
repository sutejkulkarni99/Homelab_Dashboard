<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polaris Hub - Change Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse at top,#1a1f3a 0%,#0a0f1e 50%,#050810 100%);
color:#e4e9f5;min-height:100vh;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto 20px;
padding:12px 20px;background:rgba(14,18,32,.75);border:1px solid rgba(120,140,200,.15);border-radius:14px;backdrop-filter:blur(12px)}
.header h1{font-size:18px;font-weight:600}
.header h1 span{color:#f0c987}
.nav a{color:#8b96b0;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;margin-left:6px;transition:all .15s}
.nav a:hover{color:#f0c987;background:rgba(240,201,135,.08)}
.card{max-width:640px;margin:0 auto;background:rgba(14,18,32,.75);border:1px solid rgba(120,140,200,.15);
border-radius:14px;padding:32px;backdrop-filter:blur(12px)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:#8b96b0;margin-bottom:20px;font-weight:500}
label{display:block;font-size:11px;color:#8b96b0;margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase;margin-top:16px}
input{width:100%;padding:14px;background:#f0ecd8;border:none;border-radius:10px;color:#1a1206;font-size:15px;outline:none;font-family:inherit}
input:focus{box-shadow:0 0 0 3px rgba(240,201,135,.25)}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
background:linear-gradient(135deg,#f0c987,#d4a86b);color:#1a1206;transition:all .15s;font-family:inherit;margin-top:24px}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;font-size:13px;margin-top:16px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ff6b6b}
.msg.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ade80}
.hint{font-size:12px;color:#8b96b0;margin-top:8px;line-height:1.5}
</style></head><body>
<div class="header">
<h1>Polaris <span>Security</span></h1>
<div class="nav">
<a href="/">Dashboard</a>
<a href="/projects">Projects</a>
<a href="/ssh">SSH</a>
</div>
</div>
<div class="card">
<h2>Change Password</h2>
<div id="msg" class="msg"></div>
<label>Current Password</label>
<input type="password" id="old" placeholder="Your current password" autocomplete="current-password">
<label>New Password</label>
<input type="password" id="new" placeholder="At least 12 characters" autocomplete="new-password">
<div class="hint">Use a passphrase or mix of words. Minimum 12 characters. This will be hashed with Argon2id and stored locally.</div>
<label>Confirm New Password</label>
<input type="password" id="confirm" placeholder="Retype new password" autocomplete="new-password">
<button id="submit" onclick="doChange()">Change Password</button>
</div>
<script>
function msg(text,cls){const m=document.getElementById('msg');m.textContent=text;m.className='msg show '+cls;}
function clearMsg(){document.getElementById('msg').className='msg';}
async function doChange(){
  clearMsg();
  const o=document.getElementById('old').value;
  const n=document.getElementById('new').value;
  const c=document.getElementById('confirm').value;
  if(!o||!n||!c){msg('Fill all three fields','err');return;}
  if(n.length<12){msg('New password must be at least 12 characters','err');return;}
  if(n!==c){msg('Passwords do not match','err');return;}
  const b=document.getElementById('submit');b.disabled=true;b.textContent='Changing...';
  try{
    const ck=document.cookie.split('; ').find(r=>r.startsWith('csrf_token='));
    const tok=ck?decodeURIComponent(ck.split('=').slice(1).join('=')):'';
    const r=await fetch('/api/change-password',{method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':tok},
      body:JSON.stringify({old_password:o,new_password:n,confirm_password:c})});
    const d=await r.json();
    if(d.ok){msg('Password changed. Redirecting to login...','ok');
      setTimeout(()=>window.location.href='/login',2000);return;}
    msg(d.error||'Failed','err');
  }catch(e){msg('Error: '+e.message,'err');}
  b.disabled=false;b.textContent='Change Password';
}
</script></body></html>
