<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polaris Hub - Setup 2FA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse at top,#1a1f3a 0%,#0a0f1e 50%,#050810 100%);
color:#e4e9f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(14,18,32,.75);border:1px solid rgba(120,140,200,.15);
border-radius:16px;padding:36px;max-width:480px;width:100%;backdrop-filter:blur(12px)}
h1{font-size:24px;text-align:center;margin-bottom:6px;font-weight:600}
h1 span{color:#f0c987}
.sub{text-align:center;color:#8b96b0;font-size:13px;letter-spacing:1.5px;
text-transform:uppercase;margin-bottom:24px}
label{display:block;font-size:11px;color:#8b96b0;margin-bottom:8px;
letter-spacing:1.5px;text-transform:uppercase;margin-top:14px}
input{width:100%;padding:14px;background:#f0ecd8;border:none;border-radius:10px;
color:#1a1206;font-size:16px;outline:none;font-family:inherit}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;
font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f0c987,#d4a86b);
color:#1a1206;transition:all .15s;font-family:inherit;margin-top:20px}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.qr{background:#fff;padding:20px;border-radius:12px;text-align:center;margin-bottom:20px}
.qr img{max-width:100%;display:block}
.manual{background:rgba(0,0,0,.25);padding:14px;border-radius:10px;
font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;
color:#7ee0c9;text-align:center;margin-bottom:16px;letter-spacing:1.5px}
.step{color:#8b96b0;font-size:13px;margin-bottom:16px;line-height:1.6}
.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);
color:#ff6b6b;padding:12px;border-radius:10px;font-size:13px;
margin-bottom:14px;display:none}
.err.show{display:block}
.hidden{display:none}
</style></head><body>
<div class="card">
<h1>Polaris <span>2FA Setup</span></h1>
<div class="sub">Two-Factor Authentication</div>
<div id="err" class="err"></div>
<div id="auth-step">
  <div class="step">Confirm your password to begin setup:</div>
  <label>Username</label>
  <input type="text" id="username" placeholder="sutej" autocomplete="username">
  <label>Password</label>
  <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  <button id="start-btn" onclick="startSetup()">Continue</button>
</div>
<div id="qr-step" class="hidden">
  <div class="step">1. Open Microsoft Authenticator.<br>
  2. Tap "+" &rarr; "Other account" &rarr; "Scan QR code".<br>
  3. Scan the image below.</div>
  <div class="qr"><img id="qr-img" src="" alt="QR"></div>
  <div class="step">Or enter this code manually:</div>
  <div class="manual" id="manual-secret"></div>
  <div class="step">4. Enter the 6-digit code from the app:</div>
  <label>Verification Code</label>
  <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="000000"
   autocomplete="one-time-code" style="text-align:center;font-size:22px;
   letter-spacing:8px;font-family:ui-monospace,monospace">
  <button id="confirm-btn" onclick="confirmSetup()">Confirm &amp; Enable 2FA</button>
</div>
</div>
<script>
let setupToken=null;
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show');}
async function startSetup(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  if(!u||!p)return showErr('Enter username and password');
  const b=document.getElementById('start-btn');b.disabled=true;b.textContent='Starting...';
  try{
    const r=await fetch('/api/setup-2fa/init',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!d.ok){showErr(d.error||'Setup failed');b.disabled=false;b.textContent='Continue';return;}
    setupToken=d.setup_token;
    document.getElementById('qr-img').src='data:image/png;base64,'+d.qr_png_b64;
    document.getElementById('manual-secret').textContent=d.secret_manual;
    document.getElementById('auth-step').classList.add('hidden');
    document.getElementById('qr-step').classList.remove('hidden');
  }catch(e){showErr('Error: '+e.message);b.disabled=false;b.textContent='Continue';}
}
async function confirmSetup(){
  const code=document.getElementById('code').value.trim();
  if(!/^[0-9]{6}$/.test(code))return showErr('Enter 6-digit code');
  const b=document.getElementById('confirm-btn');b.disabled=true;b.textContent='Verifying...';
  try{
    const r=await fetch('/api/setup-2fa/confirm',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({setup_token:setupToken,code})});
    const d=await r.json();
    if(!d.ok){showErr(d.error||'Failed');b.disabled=false;b.textContent='Confirm & Enable 2FA';return;}
    window.location.href='/login';
  }catch(e){showErr('Error: '+e.message);b.disabled=false;b.textContent='Confirm & Enable 2FA';}
}
</script></body></html>
