<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f1e">
<title>Polaris Hub - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse at top,#1a1f3a 0%,#0a0f1e 50%,#050810 100%);
color:#e4e9f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(14,18,32,.75);border:1px solid rgba(120,140,200,.15);
border-radius:16px;padding:40px 36px;max-width:420px;width:100%;backdrop-filter:blur(12px)}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;
background:rgba(240,201,135,.08);border:1px solid rgba(240,201,135,.25);
display:flex;align-items:center;justify-content:center;font-size:28px;
color:#f0c987;box-shadow:0 0 24px rgba(240,201,135,.15)}
h1{font-size:26px;text-align:center;font-weight:600;margin-bottom:4px}
h1 span{color:#f0c987}
.sub{text-align:center;color:#8b96b0;font-size:11px;letter-spacing:2px;
text-transform:uppercase;margin-bottom:28px}
label{display:block;font-size:11px;color:#8b96b0;margin-bottom:8px;
letter-spacing:1.5px;text-transform:uppercase;margin-top:14px}
input{width:100%;padding:14px;background:#f0ecd8;border:none;border-radius:10px;
color:#1a1206;font-size:15px;outline:none;font-family:inherit}
input:focus{box-shadow:0 0 0 3px rgba(240,201,135,.25)}
input#totp{text-align:center;font-size:20px;letter-spacing:4px;
font-family:ui-monospace,monospace;text-transform:uppercase}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;
font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f0c987,#d4a86b);
color:#1a1206;transition:all .15s;font-family:inherit;margin-top:24px}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);
color:#ff6b6b;padding:12px;border-radius:10px;font-size:13px;
margin-top:14px;display:none}
.err.show{display:block}
.hidden{display:none}
.hint{font-size:11px;color:#8b96b0;margin-top:6px;letter-spacing:0.5px;text-transform:none;line-height:1.4}
.footer{text-align:center;margin-top:24px;font-size:11px;color:#8b96b0;letter-spacing:1px}
</style></head><body>
<div class="card">
<div class="logo">
<div class="logo-icon">&#10022;</div>
<h1>Polaris<span>Hub</span></h1>
<div class="sub">Dual-Node v2.0</div>
</div>
<div id="err" class="err"></div>
<div id="pass-step">
<label>Username</label>
<input type="text" id="username" placeholder="sutej" autocomplete="username" autofocus>
<label>Password</label>
<input type="password" id="password" placeholder="Password" autocomplete="current-password">
</div>
<div id="totp-step" class="hidden">
<label>2FA Code or Backup Code</label>
<input type="text" id="totp" maxlength="9" placeholder="000000 or XXXX-XXXX" autocomplete="one-time-code">
<div class="hint">Enter the 6-digit code from your authenticator, or an 8-character backup code.</div>
<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;letter-spacing:0;text-transform:none;color:#8b96b0;cursor:pointer">
<input type="checkbox" id="trust-device" style="width:auto;padding:0;background:transparent;accent-color:#f0c987">
Trust this device for 24 hours
</label>
</div>
<button id="submit-btn" onclick="doLogin()">Sign In</button>
<div class="footer">&#128274; Tailscale Mesh Access Required</div>
</div>
<script>
function showErr(m){var e=document.getElementById("err");e.textContent=m;e.classList.add("show");}
function hideErr(){document.getElementById("err").classList.remove("show");}
async function doLogin(){
  hideErr();
  var u=document.getElementById("username").value.trim();
  var p=document.getElementById("password").value;
  var t=document.getElementById("totp").value.trim().toUpperCase();
  if(!u||!p){showErr("Enter username and password");return;}
  var body={username:u,password:p};
  if(t)body.totp=t;
  var tb=document.getElementById("trust-device");
  if(tb&&tb.checked)body.trust_device=true;
  var b=document.getElementById("submit-btn");
  b.disabled=true;b.textContent="Signing in...";
  try{
    var r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    var d=await r.json();
    if(d.needs_totp_setup){window.location.href=d.setup_url||"/setup-2fa";return;}
    if(d.needs_totp){
      document.getElementById("pass-step").classList.add("hidden");
      document.getElementById("totp-step").classList.remove("hidden");
      document.getElementById("totp").focus();
      b.disabled=false;b.textContent="Verify";
      return;
    }
    if(d.ok){window.location.href=d.redirect||"/";return;}
    showErr(d.error||"Login failed");
  }catch(e){showErr("Error: "+e.message);}
  b.disabled=false;b.textContent="Sign In";
}
document.getElementById("username").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("password").focus();});
document.getElementById("password").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
document.getElementById("totp").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
</script></body></html>
